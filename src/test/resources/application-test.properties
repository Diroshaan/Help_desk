# Settings for the automated tests only (the "test" profile, switched on by
# @ActiveProfiles("test") on the integration test). Loaded ON TOP of the normal
# application.properties, so the tests still run on the in-memory H2 database.

# A fixed bootstrap admin password, for two reasons. Without one, the seeder
# generates a password and prints it as a WARN - harmless for a throwaway test
# database, but the rule on this project is that a logged credential is treated
# as live, and CI logs are readable by everyone with access to the repository.
# And a known value would let a test sign in as the admin if one ever needs to.
# This is NOT a real credential: it only exists inside an in-memory database
# that is created when the tests start and destroyed when they finish.
helpdesk.bootstrap-admin.password=TestOnlyAdmin1

# The SQL echo is useful while developing and noise in a test run.
spring.jpa.show-sql=false

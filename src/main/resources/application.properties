# --- Server ---
server.port=8080

# --- H2 in-memory database (development only, per proposal Section 9) ---
spring.datasource.url=jdbc:h2:mem:helpdeskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console, so you can browse the database in a browser at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# 'update' auto-creates/updates tables from your @Entity classes as you build them.
# Good for development; will be replaced before final evaluation per proposal Section 9.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- File upload limits (per proposal: max 5MB, PDF/image only) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

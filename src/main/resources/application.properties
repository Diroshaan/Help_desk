# Default settings: runs on an in-memory H2 database, no setup needed.
# For MySQL, run with the "mysql" profile (see application-mysql.properties).
# The first admin account is created on startup. Set it with HELPDESK_BOOTSTRAPADMIN_EMAIL,
# HELPDESK_BOOTSTRAPADMIN_DISPLAYNAME and HELPDESK_BOOTSTRAPADMIN_PASSWORD; with no
# password set, a random one is printed once in the startup log.
server.port=8080

# H2 in-memory database (development only - data is lost on restart)
spring.datasource.url=jdbc:h2:mem:helpdeskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Browse the H2 database at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate creates and updates tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Upload limit (max 5MB per file)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

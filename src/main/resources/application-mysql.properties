# MySQL profile. Turn it on with one of:
#   IntelliJ: Run > Edit Configurations > Active profiles: mysql
#   Maven:    mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#   Jar:      java -jar app.jar --spring.profiles.active=mysql
# Settings here override application.properties; anything not listed is inherited.
#
# Set these environment variables in your run configuration (default after ':'):
#   MYSQL_HOST, MYSQL_PORT, MYSQL_DB, MYSQL_USER, MYSQL_PASSWORD, MYSQL_SSL_MODE

# Connection. SSL is required by default because the hosted database is on the
# public internet; use MYSQL_SSL_MODE=PREFERRED only for a local server without TLS.
# UTC stops timestamps shifting with each laptop's timezone.
# On a local MySQL, create the database once first: CREATE DATABASE helpdeskdb;
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:helpdeskdb}?sslMode=${MYSQL_SSL_MODE:REQUIRED}&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Credentials come from environment variables. Never commit the password here.
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# The free hosted plan has a small shared connection limit, so keep the pool small.
spring.datasource.hikari.maximum-pool-size=5

# Schema changes that Hibernate can't make (drops, constraints) are in docs/migrations.
spring.jpa.hibernate.ddl-auto=update

# No H2 console on MySQL.
spring.h2.console.enabled=false

# SQL logging off, so the demo console stays readable.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

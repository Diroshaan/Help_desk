# ===========================================================================
#  MySQL profile
#  ---------------------------------------------------------------------------
#  Activate it with ONE of:
#     IntelliJ  : Run > Edit Configurations > Active profiles: mysql
#     Maven     : mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#     Jar       : java -jar app.jar --spring.profiles.active=mysql
#
#  WHY THIS IS A SEPARATE FILE, and not an edit to application.properties
#  ---------------------------------------------------------------------------
#  application.properties is shared by all six of us. Changing its datasource
#  to MySQL would mean nobody could run the project until they had a MySQL
#  server to point at - a change to one file breaking five other people's
#  machines in the middle of a sprint.
#
#  Spring Boot loads application.properties FIRST and then overlays
#  application-<profile>.properties on top of it, so with the mysql profile
#  active every setting below replaces its counterpart in the shared file, and
#  everything not mentioned here (server.port, the multipart limits, show-sql)
#  is inherited unchanged. With no profile active this file is never read at
#  all and the project still starts on H2 exactly as before.
#
#  The intended split:
#    - day-to-day development runs on H2 (no profile). Fast, disposable, and
#      a half-finished @Entity can only break your own machine.
#    - this profile points at the SHARED hosted database, for checking your
#      work against everyone else's and for the demo, where data has to
#      survive a restart.
#
#  That separation matters more than it looks. ddl-auto below is 'update',
#  which only ever ADDS things to a schema and never removes them. Six people
#  pointing an unfinished entity at one shared database would create that
#  table - and any wrong column type - permanently, for everybody. Keeping
#  H2 as the default is what stops that.
# ===========================================================================

# --- Connection ---
#
# Every part of the URL is an environment variable with a local-MySQL default
# after the ':', so ONE profile works against both a database on your own
# machine and the hosted one. Switching between them is a run-configuration
# change, not a file edit - which also means no merge conflict when two of us
# point at different servers.
#
# For the hosted database (Aiven), its console gives you the host, the port
# (it is NOT 3306 - managed services use a high random port), the user, and
# the database name (Aiven pre-creates one called "defaultdb"). Set them as
# environment variables in your IntelliJ run configuration.
#
# sslMode=REQUIRED, deliberately: the hosted database is reachable from
# anywhere on the internet, so an unencrypted connection would put the
# password and every row we send on the open network. Aiven refuses plaintext
# connections anyway, but stating it here means the application fails loudly
# if it is ever pointed at a server that would have accepted one, instead of
# silently downgrading. Set MYSQL_SSL_MODE=PREFERRED only for a local server
# with no TLS configured.
#
# serverTimezone=UTC keeps LocalDateTime values (Student.createdAt, and every
# createdAt/updatedAt on the other modules' entities) from being shifted by
# whatever timezone a machine happens to be in - so the timestamps a marker
# sees are the ones the application actually wrote, on any laptop.
#
# Note there is no createDatabaseIfNotExist here. A managed service creates
# the database for you and the user has no privilege to make another, so the
# flag would fail rather than help. On a LOCAL MySQL, create it once by hand:
#     CREATE DATABASE helpdeskdb;
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:helpdeskdb}?sslMode=${MYSQL_SSL_MODE:REQUIRED}&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Credentials ---
# Read from environment variables, with the value after ':' used when the
# variable is not set.
#
# The password is deliberately NOT written in this file. This file is committed
# to a shared GitHub repository, and a database password in version control
# stays in the history even after it is edited out. With a database hosted on
# the public internet that is not an inconvenience - it is a breach: anyone
# who finds it can read or delete every row from anywhere. Set MYSQL_PASSWORD
# in your IntelliJ run configuration (Environment variables); it stays on your
# machine and never reaches the repository. This is what NFR 5.1 is about.
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# --- Connection pool ---
# The free hosted plan caps the server at 76 connections in total, shared by
# everyone on the team. HikariCP defaults to 10 per application, so six of us
# running at once would take 60 of those and leave almost nothing for a
# database client or a seventh run. Five is plenty for a project at this
# scale and keeps the shared budget from being exhausted by whoever starts
# their app first.
spring.datasource.hikari.maximum-pool-size=5

# --- Schema ---
# 'update' lets Hibernate create and extend tables from the @Entity classes,
# the same as on H2. It is right for now, while entities are still being added
# every day by six people.
#
# It is NOT right for the final submission: 'update' only ever adds things. It
# never drops a column, never narrows a type, and never notices that the
# database has drifted away from the code - so a schema built this way is a
# record of every mistake anyone made along the way. Before the final
# evaluation this should become 'validate', with the schema created from a
# checked-in SQL script, so the database is a deliberate artefact we can show
# rather than a side effect of running the app.
spring.jpa.hibernate.ddl-auto=update

# The H2 console has no datasource to attach to under this profile.
spring.h2.console.enabled=false

# --- Deliberately NOT set yet: spring.jpa.open-in-view=false ---
# Spring Boot logs a warning about this on every startup, and false is the
# better setting in principle: it stops lazy associations being loaded from
# inside the view layer, long after the service that "owned" the data returned.
#
# It is left at the default here because turning it off changes behaviour, and
# the change bites exactly where this project is heading. StudentResponse.from()
# runs in the controller, outside the service's transaction. Today that is safe,
# because Student has no lazy associations. The moment the activity log adds a
# @OneToMany, mapping it in the controller with open-in-view=false would throw
# LazyInitializationException.
#
# So this is a decision waiting on that feature, not an oversight: when the
# activity log lands, the log should be loaded inside a @Transactional service
# method and handed to the response explicitly - and then this line can be
# switched on with nothing left to break.
